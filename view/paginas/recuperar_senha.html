<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha · LaaCLab</title>
  <link rel="stylesheet" href="/estatico/css/estilos.css">
</head>
<body data-tela="recuperar-senha" data-casca="auth">
<!-- CASCA:INICIO -->
  <div class="auth">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7.5 15h9"/>
      </svg>
      <span>LaaC<span style="color:var(--brand)">Lab</span></span>
    </div>
<!-- CASCA:FIM -->
    <div id="conteudo">
      <h1>Esqueceu a senha?</h1>
      <p class="sub">Enviaremos um link de verificação para o e-mail da conta.</p>
      <div class="err" id="erro-geral" hidden></div>
      <div class="estado" id="ok" hidden></div>
      <form id="form-recuperar" novalidate>
        <div>
          <label for="email">E-mail</label>
          <input type="email" name="email" id="email" autocomplete="email" required>
        </div>
        <button type="submit" class="btn btn--primary">Enviar verificação</button>
      </form>
      <p class="alt"><a href="/login">Voltar ao login</a></p>
    </div>
<!-- CASCA:RODAPE:INICIO -->
  </div>
<!-- CASCA:RODAPE:FIM -->
<script src="/estatico/js/api.js"></script>
<script src="/estatico/js/casca.js"></script>
<script src="/estatico/js/recuperar_senha.js"></script>
</body>
</html>
